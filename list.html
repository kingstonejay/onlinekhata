<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>સાઇટ જાળવણી હેઠળ</title>
  <!-- Font & Icons (Google Fonts & Font Awesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans Gujarati', 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle animated background particles (floating shapes) */
    .bg-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 215, 100, 0.04);
      animation: floatShape 18s infinite alternate ease-in-out;
    }

    .shape:nth-child(1) {
      width: 280px;
      height: 280px;
      top: -60px;
      left: -80px;
      animation-duration: 22s;
      background: rgba(255, 200, 80, 0.03);
    }

    .shape:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: -120px;
      right: -100px;
      animation-duration: 26s;
      animation-delay: -4s;
      background: rgba(80, 200, 255, 0.03);
    }

    .shape:nth-child(3) {
      width: 200px;
      height: 200px;
      top: 40%;
      left: 70%;
      animation-duration: 20s;
      animation-delay: -8s;
      background: rgba(255, 150, 100, 0.03);
    }

    @keyframes floatShape {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(50px, 30px) scale(1.2) rotate(15deg); }
    }

    /* main card */
    .maintenance-card {
      position: relative;
      z-index: 10;
      max-width: 680px;
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 56px 56px 56px 56px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 215, 100, 0.1);
      padding: 2.5rem 2.2rem 3rem;
      transition: all 0.3s ease;
      text-align: center;
      color: #f5f0e8;
      animation: cardGlow 6s infinite alternate;
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,100,0.1); }
      100% { box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,215,100,0.25); }
    }

    /* icon & animated gear */
    .icon-wrapper {
      font-size: 4.2rem;
      color: #f7d67a;
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulseIcon 3s infinite ease-in-out;
      filter: drop-shadow(0 8px 16px rgba(247, 214, 122, 0.3));
    }

    .icon-wrapper i {
      animation: spinSlow 12s infinite linear;
      display: inline-block;
    }

    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseIcon {
      0% { transform: scale(1); }
      50% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    /* heading */
    h1 {
      font-size: 2.9rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0.4rem 0 0.8rem;
      background: linear-gradient(135deg, #f7e6c9, #f7d67a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 4px 20px rgba(247, 214, 122, 0.15);
      line-height: 1.2;
    }

    /* subhead / description */
    .sub-message {
      font-size: 1.25rem;
      font-weight: 500;
      color: #d4d9e6;
      margin-bottom: 1.2rem;
      padding: 0 0.5rem;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    .description {
      font-size: 1rem;
      line-height: 1.7;
      color: #bcc6d6;
      margin: 1.2rem 0 2rem;
      padding: 0 0.5rem;
      font-weight: 400;
      border-left: 2px solid rgba(247, 214, 122, 0.2);
      border-right: 2px solid rgba(247, 214, 122, 0.2);
      padding: 0.6rem 1.2rem;
      display: inline-block;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(2px);
    }

    /* animated progress bar (stylish) */
    .progress-container {
      width: 100%;
      max-width: 380px;
      margin: 1.8rem auto 1.2rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 60px;
      height: 8px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.3);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f7c35c, #f7d67a, #f7c35c);
      background-size: 200% 100%;
      border-radius: 60px;
      animation: fillProgress 3.8s infinite ease-in-out, shimmer 2s infinite linear;
      box-shadow: 0 0 12px rgba(247, 214, 122, 0.5);
    }

    @keyframes fillProgress {
      0% { width: 10%; }
      50% { width: 80%; }
      100% { width: 10%; }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* status row */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem 1.2rem;
      flex-wrap: wrap;
      margin: 1.8rem 0 1rem;
      font-size: 1rem;
      color: #cbd2e0;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(247, 214, 122, 0.12);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(247, 214, 122, 0.15);
      backdrop-filter: blur(4px);
      font-weight: 500;
    }

    .status-badge i {
      color: #f7d67a;
      font-size: 0.9rem;
      animation: blinkDot 1.8s infinite;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .eta {
      background: rgba(255,255,255,0.02);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.04);
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .eta i {
      margin-right: 6px;
      color: #f7d67a;
    }

    /* contact / social */
    .social-links {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      flex-wrap: wrap;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #d4dceb;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.5rem 1.3rem;
      border-radius: 60px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    .social-links a i {
      font-size: 1.1rem;
      color: #f7d67a;
      transition: transform 0.3s ease;
    }

    .social-links a:hover {
      background: rgba(247, 214, 122, 0.12);
      border-color: rgba(247, 214, 122, 0.25);
      transform: translateY(-3px);
      color: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .social-links a:hover i {
      transform: scale(1.1);
    }

    /* footer note */
    .footer-note {
      margin-top: 2.8rem;
      font-size: 0.9rem;
      color: #8d9bb0;
      letter-spacing: 0.5px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .footer-note i {
      color: #f7d67a;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* responsive */
    @media (max-width: 500px) {
      .maintenance-card {
        padding: 2rem 1.2rem 2.2rem;
        border-radius: 40px;
      }
      h1 {
        font-size: 2.3rem;
      }
      .icon-wrapper {
        font-size: 3.5rem;
      }
      .sub-message {
        font-size: 1.05rem;
      }
      .description {
        font-size: 0.9rem;
        padding: 0.4rem 0.8rem;
      }
      .status-row {
        flex-direction: column;
        gap: 0.6rem;
      }
      .social-links {
        gap: 1rem;
      }
      .social-links a {
        padding: 0.4rem 1rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 1.9rem;
      }
      .maintenance-card {
        padding: 1.5rem 0.8rem 1.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- animated background shapes -->
  <div class="bg-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <!-- main card -->
  <div class="maintenance-card">
    <!-- animated icon -->
    <div class="icon-wrapper">
      <i class="fas fa-cogs"></i>
    </div>

    <!-- heading in Gujarati -->
    <h1>જાળવણી હેઠળ</h1>

    <!-- sub message -->
    <div class="sub-message">
      <i class="fas fa-wrench" style="margin-right: 8px; opacity: 0.7;"></i> 
      અમે ટૂંક સમયમાં પાછા આવીશું
    </div>

    <!-- description -->
    <div class="description">
      <i class="fas fa-code" style="margin-right: 10px; opacity: 0.6;"></i> 
      સાઇટને બહેતર બનાવવા માટે અમે કામ કરી રહ્યા છીએ. કૃપા કરીને થોડી રાહ જુઓ.
    </div>

    <!-- animated progress bar -->
    <div class="progress-container">
      <div class="progress-fill"></div>
    </div>

    <!-- status row with eta & live indicator -->
    <div class="status-row">
      <span class="status-badge">
        <i class="fas fa-circle"></i> અપડેટ ચાલુ છે
      </span>
      <span class="eta">
        <i class="far fa-clock"></i> અંદાજિત સમય: ૧૦ મિનિટ
      </span>
    </div>

    <!-- social / contact links (gujarati text) -->
    <div class="social-links">
      <a href="#"><i class="fas fa-envelope"></i> સંપર્ક</a>
      <a href="#"><i class="fab fa-twitter"></i> ટ્વિટર</a>
      <a href="#"><i class="fab fa-instagram"></i> ઇન્સ્ટા</a>
    </div>

    <!-- footer note with Gujarati -->
    <div class="footer-note">
      <i class="fas fa-tools"></i> 
      <span>જાળવણી ટીમ · ૨૦૨૬</span>
      <i class="fas fa-heart" style="color: #f7a07a; margin-left: 4px;"></i>
    </div>
  </div>

  <!-- small extra: no additional scripts needed, pure static animated -->
</body>
</html>
